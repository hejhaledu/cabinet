<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ŠestaApp – ZASEDAČKA</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sestaapp-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="../shared/sesta.css?v=1.0.2">
<style>
:root{
  --bg:var(--bg-work);--surface:var(--bg-app);--surface-2:var(--bg-subtle);--surface-3:var(--bg-subtle);--viewer-bg:var(--bg-work);
  --faint:var(--muted);
  --primary:var(--focus);--primary-600:var(--focus);--primary-weak:var(--yellow-soft);--primary-ring:var(--focus-ring);
  --danger-bg:var(--danger-soft);--warn-bg:var(--warn-soft);--success:var(--ok);--success-bg:var(--ok-soft);
  --shadow-sm:var(--sh-1);--shadow-md:var(--sh-2);--shadow-lg:var(--sh-3);
  --radius:14px;--radius-sm:10px;
  --stage-bg:var(--bg-canvas);--board-bg:var(--navy);--board-fg:#FFFFFF;
  --desk-bg:var(--bg-app);--desk-border:var(--border-strong);
  --toast-bg:var(--tip-bg);--toast-fg:var(--tip-fg);--brand-yellow:var(--yellow);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-rows:64px 1fr;height:100vh;height:100dvh}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#4F8BFF);box-shadow:0 4px 12px rgba(37,99,235,.35);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand-yellow)}
.logo svg{width:22px;height:22px}
.brand{min-width:0}
.brand-title{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand-title .sl{color:var(--faint);font-weight:500;margin:0 4px}
.brand-title .ap{color:var(--primary)}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}

/* ---------- buttons ---------- */
.btn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{background:var(--surface-3)}
.btn:focus-visible,.seg button:focus-visible,.ic-btn:focus-visible,.inp:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.28)}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px;gap:6px}
.btn.sm svg.i{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger-t{color:var(--danger)}
.btn.on{background:var(--primary-weak);border-color:var(--primary);color:var(--primary)}
.ic-btn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;transition:background .15s,color .15s;flex:none}
.ic-btn:hover{background:var(--surface-3);color:var(--text)}
.ic-btn svg.i{width:16px;height:16px}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:340px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.card-h .num{width:26px;height:26px;border-radius:8px;background:var(--primary-weak);color:var(--primary);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.card-h .ttl{font-size:15px;font-weight:600}
.card-h .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.card-h .chev{color:var(--faint);transition:transform .15s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .card-b{display:none}
.card-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:5px;display:block}
.hint{font-size:12px;color:var(--muted)}
.inp{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 10px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
textarea.inp{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.4}
.inp::placeholder{color:var(--faint)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.s2{grid-column:span 2}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-3);border-radius:11px}
.seg button{height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap}
.seg button svg.i{width:15px;height:15px}
.seg button.act{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm);font-weight:600}
html[data-theme="dark"] .seg button.act{background:var(--surface-2)}
.row{display:flex;align-items:center;gap:8px}
.seg-sm button{font-size:12px;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.seg{min-width:0}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:700;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.stat.ok b{color:var(--success)} .stat.wr b{color:var(--warn)}
.info{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.info svg.i{color:var(--primary);width:16px;height:16px;margin-top:1px}
.info.warn{background:var(--warn-bg);border-color:transparent}
.info.warn svg.i{color:var(--warn)}
.info ul{margin:4px 0 0;padding-left:16px}

/* student list */
.st-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:none}
.st{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-bottom:1px solid var(--border);background:var(--surface);cursor:grab;touch-action:none;transition:background .15s}
.st:last-child{border-bottom:0}
.st:hover{background:var(--surface-2)}
.st .no{width:20px;font-size:12px;color:var(--faint);text-align:right;flex:none}
.st .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.st .nm small{color:var(--muted);font-weight:400;margin-left:6px}
.st .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.st .dot.on{background:var(--success)}
.st .eye.on{color:var(--primary);background:var(--primary-weak)}
.st .eye.on.far{color:var(--warn);background:var(--warn-bg)}
.st input.inp{height:28px;font-size:13px}
.st.hl{background:var(--primary-weak)}
.empty-list{padding:18px 12px;text-align:center;color:var(--muted);font-size:12.5px}

/* ---------- work area ---------- */
.work{display:grid;grid-template-rows:52px 1fr auto;min-width:0;min-height:0;background:var(--viewer-bg);position:relative}
.zoombar{position:absolute;right:16px;top:64px;z-index:40;display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow-md)}
.zoombar .ic-btn{border-radius:999px}
.rel-legend{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.rel-legend span{display:inline-flex;align-items:center;gap:6px}
.tb{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;height:100%;margin-right:6px}
.tab{height:100%;padding:0 12px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.act{color:var(--primary);border-bottom-color:var(--primary)}
.tab .badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.tab.act .badge{background:var(--primary-weak);color:var(--primary)}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.zoom-lbl{min-width:46px;text-align:center;font-size:12px;color:var(--muted)}
.vp{overflow:auto;display:flex;padding:28px 24px;min-height:0;position:relative}
.stage-wrap{margin:auto;flex:none;position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;background-color:var(--stage-bg);background-image:radial-gradient(var(--grid-dot) 1.2px,transparent 1.3px);background-size:20px 20px;background-position:-10px -10px;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md)}
.item{position:absolute;touch-action:none;user-select:none;transition:left .14s ease-out,top .14s ease-out,width .14s,height .14s,box-shadow .15s,border-color .15s}
.item.dragging{transition:none;z-index:20;box-shadow:var(--shadow-lg)!important;cursor:grabbing}
.mode-desks .item{cursor:grab}
.board{background:var(--board-bg);color:var(--board-fg);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.3em;box-shadow:var(--shadow-sm);border:2px solid transparent}
.board.vert span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em}
.board::before{content:"";position:absolute;left:10%;right:10%;bottom:3px;height:2px;border-radius:2px;background:var(--brand-yellow);opacity:.85}
.board.vert::before{left:auto;right:3px;top:10%;bottom:10%;width:2px;height:auto}
.desk{background:var(--desk-bg);border:1.5px solid var(--desk-border);border-radius:8px;display:flex;box-shadow:var(--shadow-sm);overflow:hidden}
.desk.vert{flex-direction:column}
.item.sel{border-color:var(--primary)!important;box-shadow:0 0 0 3px var(--primary-ring),var(--shadow-sm)}
.item.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(220,38,38,.22)!important}
.seat{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0 5px;transition:background .15s}
.seat+.seat{border-left:1px dashed var(--desk-border)}
.desk.vert .seat+.seat{border-left:0;border-top:1px dashed var(--desk-border)}
.seat .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--text);line-height:1.15}
.seat.occ{background:var(--primary-weak)}
.mode-students .seat.occ{cursor:grab}
.seat .plus{color:var(--faint);opacity:0;transition:opacity .15s}
.mode-students .seat:not(.occ) .plus{opacity:.8}
.mode-students .seat:not(.occ){background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 12px)}
.seat.drop{background:var(--primary)!important}
.seat.drop .nm,.seat.drop .plus{color:#fff;opacity:1}
.seat .eyeb{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:var(--primary);background:var(--surface)}
.seat .eyeb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.seat .eyeb.far{color:var(--warn);background:var(--warn-bg)}
.snap{position:absolute;border:2px dashed var(--primary);border-radius:8px;background:var(--primary-weak);opacity:.7;pointer-events:none;z-index:5}
.snap.bad{border-color:var(--danger);background:var(--danger-bg)}
.desk-type{position:absolute;left:4px;bottom:2px;font-size:9px;color:var(--faint);pointer-events:none}

/* tray */
.tray{background:var(--surface);border-top:1px solid var(--border);padding:10px 14px 12px;display:none;max-height:34vh;overflow-y:auto}
.mode-students .tray{display:block}
.tray-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.tray-h .hint{font-weight:400;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;border-radius:10px}
.chips.drop{outline:2px dashed var(--primary);outline-offset:4px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:grab;touch-action:none;user-select:none;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--primary);background:var(--primary-weak)}
.chip svg{width:13px;height:13px;fill:none;stroke:var(--primary);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.chip.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:var(--shadow-lg);border-color:var(--primary);background:var(--surface);cursor:grabbing}
.all-ok{display:flex;align-items:center;gap:8px;color:var(--success);font-size:13px;font-weight:500;padding:4px 0}
.badge-pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge-pill.ok{background:var(--success-bg);color:var(--success)}
.badge-pill.wr{background:var(--warn-bg);color:var(--warn)}
.badge-pill.bad{background:var(--danger-bg);color:var(--danger)}
.ver{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--primary-weak);color:var(--primary);margin-left:8px;vertical-align:2px;letter-spacing:0}
.tab .badge.bad{background:var(--danger-bg);color:var(--danger)}
/* porušené podmínky v lavicích */
.seat.bad{background:var(--danger-bg)!important;box-shadow:inset 0 0 0 2px var(--danger);animation:glow 1.6s ease-in-out infinite}
.seat.bad .nm{color:var(--danger)}
@keyframes glow{0%,100%{box-shadow:inset 0 0 0 2px var(--danger)}50%{box-shadow:inset 0 0 0 2px var(--danger),inset 0 0 14px rgba(220,38,38,.35)}}
.st .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
/* vztahy */
.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.edge{cursor:pointer}
.edge .hitl{stroke:transparent;stroke-width:16;fill:none}
.edge .halo{fill:none;stroke:var(--danger);stroke-width:12;opacity:.25;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.12}50%{opacity:.38}}
.edge.sel .vis{filter:drop-shadow(0 0 3px var(--primary))}
.edge.sel .selr{fill:none;stroke:var(--primary);stroke-width:9;opacity:.25}
.edge .mid{fill:var(--surface);stroke-width:2}
.edge .midt{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);height:32px;padding:0 22px 0 12px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;cursor:grab;user-select:none;touch-action:none;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,background .15s;z-index:2}
.node:hover{border-color:var(--primary)}
.node.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:30;transition:none}
.node.tgt{border-color:var(--primary);background:var(--primary-weak);box-shadow:0 0 0 4px var(--primary-ring)}
.node.bad{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);animation:nglow 1.6s ease-in-out infinite}
@keyframes nglow{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.0)}50%{box-shadow:0 0 0 5px rgba(220,38,38,.22)}}
.node svg{width:13px;height:13px;fill:none;stroke:var(--primary);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.node .hd{position:absolute;right:4px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--surface);border:2px solid var(--faint);cursor:crosshair;transition:border-color .15s,background .15s,transform .15s}
.node:hover .hd{border-color:var(--primary);transform:scale(1.15)}
.node .hd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--faint)}
.node:hover .hd::after{background:var(--primary)}
.node.unseated{border-style:dashed}
.rtypes{display:flex;gap:4px;padding:3px;background:var(--surface-3);border-radius:11px}
.rtype{height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.rtype.act{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
html[data-theme="dark"] .rtype.act{background:var(--surface-2)}
.sw{width:22px;height:0;border-top:3.5px solid;border-radius:2px;flex:none}
.sw.dash{border-top-style:dashed}
.rel-list{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.rel-list li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rel-list .sw{width:16px}
.edges{pointer-events:none}
.edge .hitl{pointer-events:stroke}
.info.bad{background:var(--danger-bg);border-color:transparent}
.info.bad svg.i{color:var(--danger)}
.rel-hint{position:absolute;left:16px;top:12px;font-size:12px;color:var(--muted);pointer-events:none;z-index:1;background:var(--stage-bg);padding:2px 6px;border-radius:6px}
.rel-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:900;padding:16px;animation:fade .15s}
.modal{width:560px;max-width:100%;max-height:calc(100vh - 32px);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.modal-h{display:flex;align-items:center;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.modal-h .ic-btn{margin-left:auto}
.modal-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.prev{background:var(--viewer-bg);border-radius:10px;padding:12px;display:grid;place-items:center;min-height:150px}
.prev svg{max-width:100%;max-height:220px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:1100;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;animation:tin .2s ease-out;max-width:360px}
.toast svg.i{width:16px;height:16px}
.toast.err svg.i{color:#F87171}
.toast.ok svg.i{color:#4ADE80}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* mobile bar */
.mbar{display:none}
#printArea{display:none}

@media (max-width:1560px){ .tb .tbc .t{display:none} .tb .tbc{padding:0 8px} }
@media (max-width:1400px){ .rtype .t{display:none} }
@media (max-width:1180px){
  .hdr-actions .btn .t{display:none}
  .hdr-actions .btn{padding:0 9px}

@media (max-width:900px){

  .main{grid-template-columns:1fr}

  .mbar{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}

/* ===== ŠestaApp 1.0 – úpravy podle společného stylu ===== */
.app{display:grid;grid-template-rows:1fr;height:auto;min-height:0}

.card-h{height:54px;padding:0 16px}

.card-h .chev{transform:none}

.inp{height:42px;border-radius:10px;border-color:var(--border)}

.btn{border-radius:10px}
.work{grid-template-rows:60px 1fr auto}
.tb{gap:6px;padding:0 14px}

.tab{height:36px;border-radius:9px;border-bottom:0;margin:0;font-weight:500;color:var(--text-2)}

/* ---------- geometry ---------- */
function rectOf(id){
  if(id==='board'){ const b=state.board; return {x:b.x, y:b.y, w:b.rot?BOARD.h:BOARD.w, h:b.rot?BOARD.w:BOARD.h}; }

function deskRect(d){ const b=DIM[d.type]; return {x:d.x, y:d.y, w:d.rot?b.h:b.w, h:d.rot?b.w:b.h}; }
const hit = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

  const ids = ['board', ...(list||state.desks).map(d=>d.id)];
  for(const id of ids){ if(id===ignore) continue;
    const o = id==='board' ? rectOf('board') : deskRect((list||state.desks).find(d=>d.id===id));
    if(hit(r,o)) return true; }

}
function findFree(w,h, prefer){
  const cx = prefer ? prefer.x : GW/2, cy = prefer ? prefer.y : GH/2;

    const d=(x+w/2-cx)**2+(y+h/2-cy)**2; if(d>=bd) continue;
    if(!collides({x,y,w,h})) { bd=d; best={x,y}; }
  }

}

               : [{x:r.x,y:r.y,w:r.w/2,h:r.h},{x:r.x+r.w/2,y:r.y,w:r.w/2,h:r.h}];
}

function deskRows(){

  const arr = state.desks.map(d=>{ const r=deskRect(d); const c = vert ? r.x+r.w/2 : r.y+r.h/2; return {id:d.id, dist:Math.abs(c-bc)}; }).sort((a,b)=>a.dist-b.dist);

/* =========================================================
   VZTAHY – podmínky mezi žáky
   ========================================================= */
const REL = {
  never:   {name:'Nikdy blízko', short:'nesmí sedět blízko', desc:'Tmavě červená – nesmí sedět spolu, vedle sebe, za sebou ani přes roh', color:'#991B1B', dark:'#EF4444', dash:false},
  apart:   {name:'Ne v lavici',  short:'nesmí sedět v jedné lavici', desc:'Světle červená – nesmí sedět v jedné lavici, jinak mohou být blízko', color:'#F87171', dark:'#FCA5A5', dash:true},
  near:    {name:'Blízko',       short:'musí sedět blízko', desc:'Světle zelená – musí sedět spolu, přes uličku nebo přes roh', color:'#4ADE80', dark:'#86EFAC', dash:true},
  together:{name:'Spolu',        short:'musí sedět spolu', desc:'Zelená – musí sedět spolu v jedné lavici', color:'#15803D', dark:'#22C55E', dash:false},
};
const pairKey = (a,b) => a<b ? a+'|'+b : b+'|'+a;
const relColor = t => document.documentElement.getAttribute('data-theme')==='dark' ? REL[t].dark : REL[t].color;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* sousedství míst: same = stejná lavice, side = vedle v řadě (přes uličku / sousední lavice),
   behind = přes lavici (před / za), corner = přes roh */
function seatGeo(){
  const rows = deskRows(), vert = !!state.board.rot, list = [];
  for(const d of state.desks) seatRects(d).forEach((r,i)=>list.push({key:d.id+':'+i, desk:d.id, idx:i, row:rows[d.id], l0:vert?r.y:r.x, l1:vert?r.y+r.h:r.x+r.w}));
  const n = list.length, M = Array.from({length:n}, ()=>Array(n).fill(null));
  const ov = (a,b) => Math.min(a.l1,b.l1)-Math.max(a.l0,b.l0);
  for(let i=0;i<n;i++){
    const a = list[i]; let L=null, Lg=Infinity, R=null, Rg=Infinity;
    for(let j=0;j<n;j++){ if(i===j) continue; const b = list[j];
      if(b.desk===a.desk) M[i][j]='same';
      if(b.row!==a.row) continue;
      if(b.l0>=a.l1-0.01){ const g=b.l0-a.l1; if(g<Rg){ Rg=g; R=j; } }
      else if(b.l1<=a.l0+0.01){ const g=a.l0-b.l1; if(g<Lg){ Lg=g; L=j; } }
    }
    for(const [k,g] of [[L,Lg],[R,Rg]]) if(k!==null && g<=6 && list[k].desk!==a.desk){ M[i][k]='side'; M[k][i]='side'; }
  }
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    if(i===j || M[i][j]) continue; const a=list[i], b=list[j];
    if(Math.abs(a.row-b.row)!==1) continue;
    if(ov(a,b) >= 0.5*Math.min(a.l1-a.l0, b.l1-b.l0)) M[i][j]='behind';
  }
  for(let i=0;i<n;i++) for(let c=0;c<n;c++){
    if(M[i][c]!=='behind') continue;
    for(let b=0;b<n;b++){
      if(b===i || b===c || M[i][b]) continue; const m = M[c][b];
      if((m==='same'||m==='side') && list[b].row===list[c].row && ov(list[c],list[b])<=0.01){ M[i][b]='corner'; M[b][i]='corner'; }
    }
  }
  return {list, M, index:Object.fromEntries(list.map((x,i)=>[x.key,i]))};
}
function relOk(t, m){
  if(t==='never') return !m;
  if(t==='apart') return m!=='same';
  if(t==='near') return m==='same' || m==='side' || m==='corner';
  if(t==='together') return m==='same';
  return true;
}
function evalRelations(g){
  if(!state.relations.length) return [];
  g = g || seatGeo();
  const pos = {};
  state.desks.forEach(d=>d.seats.forEach((sid,i)=>{ if(sid) pos[sid]=g.index[d.id+':'+i]; }));
  return state.relations.filter(r=>{ const a=pos[r.a], b=pos[r.b]; return a!==undefined && b!==undefined && !relOk(r.t, g.M[a][b]); });
}

/* rozmístění jmen na ploše vztahů */
function scatter(){
  const n = state.students.length; if(!n) return;
  const W = GW*CELL, H = GH*CELL, cols = Math.max(1, Math.ceil(Math.sqrt(n*1.9))), rows = Math.ceil(n/cols);
  const cw = (W-180)/cols, ch = Math.min(96, (H-120)/rows), y0 = (H-ch*rows)/2 + 10;
  shuffle([...state.students]).forEach((s,k)=>{
    const c = k%cols, r = Math.floor(k/cols);
    s.gx = Math.round(90 + c*cw + cw/2 + (Math.random()-.5)*cw*.22);
    s.gy = Math.round(y0 + r*ch + ch/2 + (Math.random()-.5)*ch*.45);
  });
}
function findNodeSpot(){
  const W = GW*CELL, H = GH*CELL;
  for(let y=60; y<H-30; y+=44) for(let x=90; x<W-80; x+=30)
    if(state.students.every(s=>typeof s.gx!=='number' || Math.abs(s.gx-x)>140 || Math.abs(s.gy-y)>44)) return {x, y};
  return {x:W/2 + (Math.random()-.5)*200, y:H/2 + (Math.random()-.5)*200};
}
function ensureNodePos(){
  const miss = state.students.filter(s=>typeof s.gx!=='number');
  if(!miss.length) return false;
  if(miss.length===state.students.length) scatter();
  else for(const s of miss){ const p=findNodeSpot(); s.gx=p.x; s.gy=p.y; }
  return true;
}

function rotateSel(){
  if(!sel) return;
  const o = sel==='board' ? state.board : state.desks.find(d=>d.id===sel); if(!o) return;
  const r = rectOf(sel), nw=r.h, nh=r.w;
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  const cand = [];
  const bx = Math.round(cx-nw/2), by = Math.round(cy-nh/2);
  for(let rad=0; rad<=3; rad++) for(let dy=-rad; dy<=rad; dy++) for(let dx=-rad; dx<=rad; dx++) if(Math.max(Math.abs(dx),Math.abs(dy))===rad) cand.push({x:bx+dx,y:by+dy});
  for(const c of cand){
    if(!collides({x:c.x,y:c.y,w:nw,h:nh}, sel)){ o.rot = o.rot?0:1; o.x=c.x; o.y=c.y; commit(); return; }
  }

/* ---------- auto seating (s ohledem na vztahy) ---------- */
function solveSeating(g, S, fixed, seatOrder, rank, eyeHard){
  const n = g.list.length, M = g.M;
  const assign = new Map(fixed), used = new Set(fixed.values());
  const inS = new Set(S.map(s=>s.id)), eyeOf = Object.fromEntries(state.students.map(s=>[s.id, s.eye]));
  const rels = new Map(), add = (x,o,t) => { if(!rels.has(x)) rels.set(x,[]); rels.get(x).push({o,t}); };
  for(const r of state.relations){ add(r.a, r.b, r.t); add(r.b, r.a, r.t); }
  const relevant = sid => (rels.get(sid)||[]).some(r=>inS.has(r.o) || assign.has(r.o));
  const vars = S.filter(s=>relevant(s.id) || (eyeHard && s.eye)).map(s=>s.id);
  const varSet = new Set(vars), rest = S.filter(s=>!varSet.has(s.id)).map(s=>s.id);
  if(vars.length > seatOrder.length) return {ok:false, reason:'space'};
  const consistent = (sid, i) => {
    if(eyeHard && eyeOf[sid] && g.list[i].row>2) return false;
    for(const r of rels.get(sid)||[]){
      const oi = assign.get(r.o);
      if(oi!==undefined){ if(!relOk(r.t, M[i][oi])) return false; }
      else if(inS.has(r.o) && (r.t==='together' || r.t==='near')){
        let f = false; for(let j=0;j<n;j++) if(j!==i && !used.has(j) && relOk(r.t, M[i][j])){ f=true; break; }
        if(!f) return false;
      }
    }
    return true;
  };
  const un = new Set(vars); let nodes = 0; const t0 = performance.now();
  const dfs = () => {
    if(!un.size) return true;
    if(++nodes>60000 || performance.now()-t0>3000) throw new Error('limit');
    let best = null, bd = null;
    for(const sid of un){
      const dom = []; for(const i of seatOrder) if(!used.has(i) && consistent(sid,i)) dom.push(i);
      if(!dom.length) return false;
      if(!best || dom.length<bd.length || (dom.length===bd.length && rank.get(sid)<rank.get(best))){ best=sid; bd=dom; }
    }
    un.delete(best);
    for(const i of bd){ assign.set(best,i); used.add(i); if(dfs()) return true; assign.delete(best); used.delete(i); }
    un.add(best); return false;
  };
  let ok; try{ ok = dfs(); }catch(e){ return {ok:false, reason:'limit'}; }
  if(!ok) return {ok:false, reason:'conflict'};
  for(const sid of rest){ const i = seatOrder.find(x=>!used.has(x)); if(i===undefined) break; assign.set(sid,i); used.add(i); }
  return {ok:true, assign};
}
function autoSeat(kind, all){
  const g = seatGeo(), n = g.list.length;
  if(!n){ toast('Ve třídě nejsou žádné lavice', 'err'); return; }
  if(!state.students.length){ toast('Nejdřív přidejte žáky', 'err'); return; }
  const fixed = new Map();
  if(!all) state.desks.forEach(d=>d.seats.forEach((sid,i)=>{ if(sid) fixed.set(sid, g.index[d.id+':'+i]); }));
  const S = state.students.filter(s=>!fixed.has(s.id));
  if(!S.length){ toast('Všichni žáci už sedí – pro nové rozsazení použijte „Zamíchat vše“'); return; }
  const taken = new Set(fixed.values());
  let seatOrder = [...Array(n).keys()].filter(i=>!taken.has(i));
  if(!seatOrder.length){ toast('Žádné volné místo', 'err'); return; }
  seatOrder.sort((x,y)=>g.list[x].row-g.list[y].row || g.list[x].l0-g.list[y].l0);
  if(kind==='random'){ shuffle(S); shuffle(seatOrder); }
  else S.sort((a,b)=>coll.compare(a.last,b.last)||coll.compare(a.first,b.first));
  const rank = new Map(S.map((s,i)=>[s.id,i]));
  const eyeWanted = state.opts.eyeFirst && S.some(s=>s.eye);
  let res = solveSeating(g, S, fixed, seatOrder, rank, eyeWanted), eyeDropped = false;
  if(!res.ok && eyeWanted){ const r2 = solveSeating(g, S, fixed, seatOrder, rank, false); if(r2.ok){ res = r2; eyeDropped = true; } }
  if(!res.ok){ showImpossible(res, all, fixed.size); return; }
  if(all) state.desks.forEach(d=>d.seats = d.seats.map(()=>null));
  let placed = 0;
  for(const [sid,i] of res.assign){ if(fixed.has(sid)) continue; const x = g.list[i]; const d = state.desks.find(q=>q.id===x.desk); d.seats[x.idx] = sid; placed++; }
  commit();
  const missing = S.length - placed;
  if(missing>0) toast(`Usazeno ${placed} žáků – chybí ${missing} míst`, 'err');
  else toast(`Usazeno ${placed} žáků${state.relations.length?' · vztahy splněny':''}`, 'ok');
  if(eyeDropped) setTimeout(()=>toast('Kvůli vztahům nejde všechny žáky se zrakovými obtížemi posadit do 1.–2. řady', 'err'), 400);
}
function showImpossible(res, all, fixedCount){
  const lab = labels(), tips = [];
  const deg = {}; state.relations.filter(r=>r.t==='together').forEach(r=>{ deg[r.a]=(deg[r.a]||0)+1; deg[r.b]=(deg[r.b]||0)+1; });
  for(const [sid,c] of Object.entries(deg)) if(c>1) tips.push(`${lab[sid]} má podmínku „Spolu“ s ${c} žáky, v lavici jsou ale jen dvě místa.`);
  const pairs = state.relations.filter(r=>r.t==='together').length, doubles = state.desks.filter(d=>d.type===2).length;
  if(pairs>doubles) tips.push(`Dvojic „Spolu“ je ${pairs}, dvojlavic jen ${doubles}.`);
  if(res.reason==='space') tips.push('Žáků s podmínkami je víc než volných míst.');
  if(res.reason==='limit') tips.push('Výpočet trval příliš dlouho – podmínek je pravděpodobně příliš mnoho najednou.');
  if(!all && fixedCount) tips.push('Část žáků už sedí a jejich místa se nemění – zkuste „Zamíchat vše“.');
  if(!tips.length) tips.push('Podmínky si navzájem odporují nebo na ně v tomto rozložení lavic není místo. Uvolněte některou spojnici, přidejte lavice nebo upravte uličky.');
  modal({title:'Rozsazení nelze provést', ok:'Upravit vztahy', cancel:'Zavřít',
    body:`<div class="info bad">${ico('alert')}<div><b>Za stávajících podmínek rozsazení nelze provést.</b><ul>${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`,
    onOk:()=>{ mode='rel'; sel=null; renderAll(); }});
}

/* ---------- modal & toast ---------- */
function toast(msg, kind=''){ SESTA.toast(msg, {kind}); }
function modal({title, body, ok='Potvrdit', cancel='Zrušit', danger=false, onOk, onOpen}){
  const bg = document.createElement('div'); bg.className='mbg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-h">${esc(title)}<button class="ic-btn" data-x>${ico('x')}</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn" data-x>${esc(cancel)}</button><button class="btn primary" data-ok ${danger?'style="background:var(--danger);border-color:var(--danger);box-shadow:none"':''}>${esc(ok)}</button></div></div>`;
  const close = ()=>{ bg.remove(); document.removeEventListener('keydown', key); };
  const key = e=>{ if(e.key==='Escape') close(); if(e.key==='Enter' && e.target.tagName!=='TEXTAREA'){ e.preventDefault(); bg.querySelector('[data-ok]').click(); } };
  bg.addEventListener('pointerdown', e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  bg.querySelector('[data-ok]').onclick = ()=>{ if(onOk && onOk(bg)===false) return; close(); };
  document.body.appendChild(bg); document.addEventListener('keydown', key);
  onOpen && onOpen(bg);
  setTimeout(()=>{ const f=bg.querySelector('input'); (f||bg.querySelector('[data-ok]')).focus(); }, 30);
}

   VÝSTUP: kreslení A4 listu (PDF / tisk)
   ========================================================= */
const FONT = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
async function fontsReady(){ try{ await Promise.all(['400','500','600','700'].map(w=>document.fonts.load(`${w} 16px Inter`))); await document.fonts.ready; }catch(e){} }
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawEye(ctx, cx, cy, size, color, bg){
  const s = size/24; ctx.save(); ctx.translate(cx-size/2, cy-size/2); ctx.scale(s,s);
  if(bg){ ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(12,12,13.5,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.stroke(new Path2D(EYE_PATH)); ctx.beginPath(); ctx.arc(12,12,3,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function fitText(ctx, text, maxW, size, weight, minSize){
  let fs=size; ctx.font=`${weight} ${fs}px ${FONT}`;
  while(ctx.measureText(text).width>maxW && fs>minSize){ fs-=0.25; ctx.font=`${weight} ${fs}px ${FONT}`; }
  let t=text; if(ctx.measureText(t).width>maxW){ while(t.length>1 && ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1); t+='…'; }
  return {t, fs};
}
async function renderSheet(bw){
  await fontsReady();
  const items = [{kind:'board', r:rectOf('board')}, ...state.desks.map(d=>({kind:'desk', d, r:deskRect(d)}))];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const it of items){ minX=Math.min(minX,it.r.x); minY=Math.min(minY,it.r.y); maxX=Math.max(maxX,it.r.x+it.r.w); maxY=Math.max(maxY,it.r.y+it.r.h); }
  const bbW = maxX-minX, bbH = maxY-minY;
  const m = state.meta, hasHead = !!(m.className||m.year||m.note);
  const M=34, HEAD = hasHead ? (m.note?60:46) : 4, FOOT=0;
  const pages = {land:[841.89,595.28], port:[595.28,841.89]};
  const scaleFor = k => { const [pw,ph]=pages[k]; return Math.min((pw-2*M)/bbW, (ph-2*M-HEAD-FOOT)/bbH); };
  const orient = state.opts.orient==='auto' ? (scaleFor('land')>=scaleFor('port')?'land':'port') : state.opts.orient;
  const [PW,PH] = pages[orient];
  const S = 3.125; // 225 dpi
  const cv = document.createElement('canvas'); cv.width=Math.round(PW*S); cv.height=Math.round(PH*S);
  const ctx = cv.getContext('2d'); ctx.scale(S,S);
  const C = bw ? {ink:'#000', ink2:'#333', mut:'#555', line:'#000', fill:'#fff', occ:'#fff', board:'#E5E5E5', boardFg:'#000', boardLine:'#000', eye:'#000', eyeBg:'#fff', head:'#000', accent:'#000', seatLine:'#777'}
               : {ink:'#0F172A', ink2:'#334155', mut:'#64748B', line:'#9AA8BC', fill:'#FFFFFF', occ:'#EEF4FF', board:'#334155', boardFg:'#FFFFFF', boardLine:'#334155', eye:'#2563EB', eyeBg:'#FFFFFF', head:'#0A2E6E', accent:'#FFC928', seatLine:'#B8C3D3'};
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH);
  // záhlaví
  if(!bw){ ctx.fillStyle=C.accent; ctx.fillRect(0,0,PW,5); ctx.fillStyle='#2563EB'; ctx.fillRect(0,5,PW,1.2); }
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  if(hasHead){
    let x = M; const y = M+18;
    if(m.className){ ctx.fillStyle=C.head; ctx.font=`700 22px ${FONT}`; ctx.fillText(m.className, x, y); x += ctx.measureText(m.className).width + 12; }
    if(m.year){ ctx.fillStyle=C.mut; ctx.font=`500 13px ${FONT}`; ctx.fillText(m.year, x, y); }
    if(m.note){ ctx.fillStyle=C.ink2; ctx.font=`500 11.5px ${FONT}`; ctx.fillText(m.note, M, y+19); }
    const ly = M+HEAD-12;
    ctx.strokeStyle=bw?'#000':'#E3E8EF'; ctx.lineWidth=bw?.6:1; ctx.beginPath(); ctx.moveTo(M,ly); ctx.lineTo(PW-M,ly); ctx.stroke();
  }
  // plocha
  const aw=PW-2*M, ah=PH-2*M-HEAD-FOOT;
  const cp = Math.min(aw/bbW, ah/bbH, 30);
  const ox = M + (aw-bbW*cp)/2, oy = M+HEAD + (ah-bbH*cp)/2;
  const flip = state.opts.view==='teacher';
  const T = r => { const x = flip ? (maxX-(r.x+r.w)) : (r.x-minX), y = flip ? (maxY-(r.y+r.h)) : (r.y-minY); return {x:ox+x*cp, y:oy+y*cp, w:r.w*cp, h:r.h*cp}; };
  const lab = labels(), byId = Object.fromEntries(state.students.map(s=>[s.id,s]));
  // tabule
  { const b = T(rectOf('board')), vert = !!state.board.rot;
    rr(ctx,b.x,b.y,b.w,b.h,cp*.3); ctx.fillStyle=C.board; ctx.fill();
    if(bw){ ctx.lineWidth=1.2; ctx.strokeStyle=C.boardLine; ctx.stroke(); }
    else { ctx.fillStyle=C.accent; const k=cp*.12; if(vert) ctx.fillRect(flip?b.x+k:b.x+b.w-k*2, b.y+b.h*.1, k, b.h*.8); else ctx.fillRect(b.x+b.w*.1, flip?b.y+k:b.y+b.h-k*2, b.w*.8, k); }
  }
  // lavice
  let eyeUsed=false;
  for(const d of state.desks){
    const r = T(deskRect(d)), rad = cp*.35;
    rr(ctx,r.x,r.y,r.w,r.h,rad); ctx.fillStyle=C.fill; ctx.fill();
    const srs = seatRects(d).map(T);
    srs.forEach((s,i)=>{ if(d.seats[i] && !bw){ ctx.save(); rr(ctx,r.x,r.y,r.w,r.h,rad); ctx.clip(); ctx.fillStyle=C.occ; ctx.fillRect(s.x,s.y,s.w,s.h); ctx.restore(); } });
    rr(ctx,r.x,r.y,r.w,r.h,rad); ctx.lineWidth = bw?1.1:1.2; ctx.strokeStyle=C.line; ctx.stroke();
    if(d.type===2){ ctx.save(); ctx.setLineDash([3,2.5]); ctx.lineWidth=.8; ctx.strokeStyle=C.seatLine; ctx.beginPath();
      if(d.rot){ const y=srs[0].y+srs[0].h; ctx.moveTo(r.x+cp*.3,y); ctx.lineTo(r.x+r.w-cp*.3,y); } else { const x = Math.max(srs[0].x,srs[1].x); ctx.moveTo(x,r.y+cp*.3); ctx.lineTo(x,r.y+r.h-cp*.3); }
      ctx.stroke(); ctx.restore(); }
    srs.forEach((s,i)=>{
      const sid = d.seats[i]; if(!sid || !byId[sid]) return; const st = byId[sid];
      const base = Math.min(s.h*.27, s.w*.19, 13.5);
      const f = fitText(ctx, lab[sid], s.w*.86, base, 600, 5);
      ctx.fillStyle=C.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`600 ${f.fs}px ${FONT}`;
      ctx.fillText(f.t, s.x+s.w/2, s.y+s.h/2 + (st.eye? f.fs*.18 : 0));
      if(st.eye){ eyeUsed=true; const es = Math.min(s.w,s.h)*.24; drawEye(ctx, s.x+s.w-es*.85, s.y+es*.85, es, C.eye, C.eyeBg); }
    });
  }
  if(SESTA.isTrial()){ ctx.save(); ctx.translate(PW/2,PH/2); ctx.rotate(-Math.atan2(PH,PW)); ctx.fillStyle='rgba(120,130,150,.16)'; ctx.font=`700 ${Math.min(PW,PH)*.22}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('UKÁZKA',0,0); ctx.restore(); }
  return {cv, PW, PH, orient};
}

/* minimal PDF writer (1 strana, 1 obrázek) */
async function deflate(u8){ const cs = new CompressionStream('deflate'); const st = new Blob([u8]).stream().pipeThrough(cs); return new Uint8Array(await new Response(st).arrayBuffer()); }
function pdfStr(s){ return '<FEFF'+[...s].map(c=>c.charCodeAt(0).toString(16).padStart(4,'0')).join('')+'>'; }
async function buildPdf({cv,PW,PH}, bw, title){
  const w=cv.width, h=cv.height; let img, filter, cs;
  if('CompressionStream' in window){
    const px = cv.getContext('2d').getImageData(0,0,w,h).data, ch = bw?1:3, raw = new Uint8Array(w*h*ch);
    if(bw){ for(let i=0,j=0;i<px.length;i+=4) raw[j++] = Math.round(px[i]*.299+px[i+1]*.587+px[i+2]*.114); }
    else { for(let i=0,j=0;i<px.length;i+=4){ raw[j++]=px[i]; raw[j++]=px[i+1]; raw[j++]=px[i+2]; } }
    img = await deflate(raw); filter='/FlateDecode'; cs = bw?'/DeviceGray':'/DeviceRGB';
  } else {
    const b64 = cv.toDataURL('image/jpeg', .95).split(',')[1]; const bin = atob(b64); img = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) img[i]=bin.charCodeAt(i);
    filter='/DCTDecode'; cs='/DeviceRGB';
  }
  const enc = new TextEncoder(), parts=[], off=[]; let pos=0;
  const push = x => { const b = typeof x==='string' ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const obj = (n, body) => { off[n]=pos; push(`${n} 0 obj\n${body}\nendobj\n`); };
  const f = v => v.toFixed(2);
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(PW)} ${f(PH)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  off[4]=pos; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace ${cs} /BitsPerComponent 8 /Filter ${filter} /Length ${img.length} >>\nstream\n`); push(img); push('\nendstream\nendobj\n');
  const content = `q ${f(PW)} 0 0 ${f(PH)} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const d = new Date(), p2 = n=>String(n).padStart(2,'0');
  obj(6, `<< /Title ${pdfStr(title)} /Creator ${pdfStr('ŠestaApp – ZASEDAČKA')} /Producer (SestaApp) /CreationDate (D:${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}) >>`);
  const xref = pos;
  push(`xref\n0 7\n0000000000 65535 f \n` + [1,2,3,4,5,6].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}
function checkReady(){
  if(!state.desks.length){ toast('Ve třídě nejsou žádné lavice', 'err'); return false; }
  return true;
}
let busy=false;
async function exportPdf(bw){
  if(busy || !checkReady()) return; busy=true;
  try{
    const sh = await renderSheet(bw);
    const blob = await buildPdf(sh, bw, 'Zasedací pořádek' + (state.meta.className?' – '+state.meta.className:''));
    const nm = SESTA.fileName([state.meta.className||'trida', state.meta.note, bw?'CB':'', SESTA.isTrial()?'UKAZKA':'', SESTA.today()], 'pdf');
    SESTA.download(blob, nm);
    toast(bw?'PDF pro černobílý tisk staženo':'PDF staženo', 'ok');
  }catch(e){ console.error(e); toast('Export se nepovedl: '+e.message, 'err'); }
  busy=false;
}
async function printSheet(){
  if(busy || !checkReady()) return; busy=true;
  try{
    const sh = await renderSheet(state.opts.printBw);
    const land = sh.orient==='land';
    $('#pageStyle').textContent = `@media print{@page{size:A4 ${land?'landscape':'portrait'};margin:0}#printArea img{width:${land?'297mm':'210mm'};height:${land?'209mm':'296mm'}}}`;
    const img = $('#printImg'); const url = sh.cv.toDataURL('image/png'); img.src = url;
    await img.decode().catch(()=>{});
    busy=false; window.print();
  }catch(e){ busy=false; console.error(e); toast('Tisk se nepovedl: '+e.message,'err'); }
}

/* ---------- wiring ---------- */
$$('.card-h').forEach(h=>h.addEventListener('click', ()=>h.parentElement.classList.toggle('closed')));
$('#segOrder').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ importOrder=b.dataset.v; setSeg('#segOrder', importOrder); } });
$('#segOrient').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ state.opts.orient=b.dataset.v; commit(); } });
$('#segView').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ state.opts.view=b.dataset.v; commit(); } });
$('#segPrintBw').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ state.opts.printBw=b.dataset.v==='1'; commit(); } });
$('#segMobile').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; document.body.classList.toggle('show-side', b.dataset.v==='side'); setSeg('#segMobile', b.dataset.v); if(b.dataset.v==='work') setTimeout(fitContent,30); });
let metaT;
for(const [id,k] of [['#fClass','className'],['#fYear','year'],['#fNote','note']]){
  $(id).addEventListener('input', e=>{ state.meta[k]=e.target.value; renderSide(); clearTimeout(metaT); metaT=setTimeout(()=>commit(),500); });
}
$('#bAdd').onclick = addStudents;
$('#fImport').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); addStudents(); } });
$('#bSort').onclick = ()=>{ if(!state.students.length) return; state.students.sort((a,b)=>coll.compare(a.last,b.last)||coll.compare(a.first,b.first)); commit(); };
$('#bClearSt').onclick = ()=>{ if(!state.students.length) return; const n=state.students.length; state.students=[]; state.relations=[]; state.desks.forEach(d=>d.seats=d.seats.map(()=>null)); commit(); SESTA.toast(`Smazáno všech ${n} žáků`, {action:{label:'Vrátit', run:undo}}); };
$$('.tab').forEach(t=>t.onclick=()=>{ mode=t.dataset.mode; sel=null; selRel=null; renderAll(); });
$('#bAdd2').onclick = ()=>addDesk(2); $('#bAdd1').onclick = ()=>addDesk(1);
$('#bQuick').onclick = quickLayout;
$('#bRot').onclick = rotateSel; $('#bType').onclick = toggleType; $('#bDup').onclick = dupSel; $('#bDel').onclick = delSel;
$('#rTypes').addEventListener('click', e=>{ const b=e.target.closest('.rtype'); if(!b) return; curRel=b.dataset.v;
  const r = selRel && state.relations.find(x=>pairKey(x.a,x.b)===selRel);
  if(r && r.t!==curRel){ r.t=curRel; commit(); } else renderToolbar(); });
$('#bScatter').onclick = ()=>{ if(!state.students.length) return; scatter(); commit(); };
$('#bDelRel').onclick = delRel;
$('#bAll').onclick = ()=>autoSeat('random', true);
$('#bRandom').onclick = ()=>autoSeat('random'); $('#bAlpha').onclick = ()=>autoSeat('alpha');
$('#bEyeFirst').onclick = ()=>{ state.opts.eyeFirst=!state.opts.eyeFirst; commit(); toast(state.opts.eyeFirst?'Žáci se zrakovými obtížemi půjdou při rozsazení dopředu':'Rozsazení bez ohledu na zrak'); };
function emptyDesks(){ if(!state.desks.some(d=>d.seats.some(Boolean))) return; state.desks.forEach(d=>d.seats=d.seats.map(()=>null)); commit(); SESTA.toast('Lavice vyprázdněny', {action:{label:'Vrátit', run:undo}}); }
$('#bEmpty').onclick = emptyDesks;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bZi').onclick = ()=>setZoom(zoom+.1); $('#bZo').onclick = ()=>setZoom(zoom-.1); $('#bFit').onclick = fitContent;
vp.addEventListener('wheel', e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.08:1/1.08)); } }, {passive:false});
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector('.mbg') || document.querySelector('.s-modal-bg');
  const k = e.key.toLowerCase();
  if(typing) return;
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && k==='y'){ e.preventDefault(); redo(); return; }
  if(mode==='rel'){ if((k==='delete'||k==='backspace') && selRel){ e.preventDefault(); delRel(); } else if(k==='escape' && selRel){ selRel=null; drawEdges(); renderToolbar(); } return; }
  if(mode!=='desks') return;
  if(k==='delete'||k==='backspace'){ e.preventDefault(); delSel(); }
  else if(k==='r') rotateSel(); else if(k==='d') dupSel(); else if(k==='t') toggleType();
  else if(k==='escape'){ sel=null; renderStage(); renderToolbar(); }
  else if(k.startsWith('arrow') && sel){ e.preventDefault(); const m={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k]; moveSel(...m); }
});
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(fitContent,150); });
window.addEventListener('afterprint', ()=>{ $('#printImg').removeAttribute('src'); });

/* ---------- start ---------- */
(function init(){
  try{ const raw = store.getItem(LS_KEY); state = raw ? normalize(JSON.parse(raw)) : defaultState(); }catch(e){ state = defaultState(); }
  hist=[snapshot()]; hIdx=0;
  renderAll();
  if(!state.students.length){ mode='desks'; }
  setSeg('#segMobile','work');
  requestAnimationFrame(()=>{ fitContent(); });
  document.fonts && document.fonts.ready.then(()=>fitNames());
})();

/* =========================================================
   ŠestaApp – napojení na sdílenou kostru
   ========================================================= */
const SAMPLE_NAMES = ['Adam Beneš','Anna Černá','Barbora Dvořáková','David Hájek','Eliška Horáková','Filip Jelínek','Jakub Kratochvíl','Karolína Kučerová','Lucie Marešová','Matěj Novotný','Natálie Pokorná','Ondřej Procházka','Petra Růžičková','Šimon Svoboda','Tereza Šťastná','Tomáš Urban','Vojtěch Veselý','Zuzana Zemanová','Lukáš Malý','Klára Bílková'];
function sampleState(){
  const s = defaultState();
  s.meta = {className:'7.B', note:'Ukázková třída', year:schoolYear()};
  s.students = SAMPLE_NAMES.map((n,i)=>{ const [first,last]=n.split(' '); return {id:'u'+i, first, last, eye:i===4||i===13}; });
  const order = ['u4','u13','u0','u1','u2','u3','u5','u6','u7','u8','u9','u10','u11','u12','u14','u15','u16','u17'];
  let k=0; for(const d of s.desks){ d.seats = d.seats.map(()=> order[k++] || null); }
  s.relations = [{a:'u5',b:'u6',t:'never'},{a:'u0',b:'u1',t:'always'}].filter(r=>REL[r.t]);
  return s;
}
function loadData(d){ state = normalize(d); sel=null; selRel=null; hist=[snapshot()]; hIdx=0; persist(); renderAll(); requestAnimationFrame(fitContent); }
function openCard(id, focus){ $$('.card').forEach(c=>c.classList.toggle('closed', c.id!==id)); if(innerWidth<=900){ document.body.classList.add('show-side'); setSeg('#segMobile','side'); } if(focus) setTimeout(()=>{ const f=$(focus); f && f.focus(); },50); }

SESTA.init({
  app:'zasedacka',
  subtitle: ()=> state.meta.className ? 'třída '+state.meta.className : '',
  title: ()=> [state.meta.className, state.meta.note].filter(Boolean).join(' – '),
  fileParts: ()=> [state.meta.className||'trida', state.meta.note, SESTA.today()],
  serialize: ()=> JSON.parse(snapshot()),
  load: d => loadData(d),
  actions:{
    new: ()=> { state = defaultState(); sel=null; selRel=null; mode='desks'; hist=[snapshot()]; hIdx=0; persist(); renderAll({fit:true}); $$('.card').forEach(c=>c.classList.add('closed')); },
    pdf: [ {label:'PDF (barevně)', run:()=>exportPdf(false)}, {label:'PDF pro černobílý tisk', run:()=>exportPdf(true)} ],
    print: ()=> printSheet()
  },
  check: ()=>{
    const out=[];
    if(!state.desks.length) out.push({level:'err', text:'Ve třídě nejsou žádné lavice.', go:()=>{ mode='desks'; renderAll(); }});
    if(!state.meta.className) out.push({text:'Není vyplněný název třídy – na plánku nebude nadpis.', go:()=>openCard('cClass','#fClass')});
    const n=state.students.length, un=state.students.filter(s=>!seatOf(s.id)).length;
    if(!n) out.push({text:'Ve třídě nejsou žádní žáci – vytiskne se prázdný plánek.', go:()=>openCard('cStudents','#fImport')});
    else if(un) out.push({text:`Neusazení žáci: ${un} z ${n}.`, go:()=>{ mode='students'; renderAll(); }});
    const bad = evalRelations(); if(bad.length) out.push({text:`Nesplněné vztahy mezi žáky: ${bad.length}.`, go:()=>{ mode='rel'; renderAll(); }});
    return out;
  },
  trial:{ sample: sampleState, get: ()=> JSON.parse(snapshot()), set: d => loadData(d) },
  empty:{ host:'#work', text:'Navrhněte zasedací pořádek třídy a vytiskněte ho.',
    test: ()=> !state.students.length,
    start: ()=> openCard('cClass','#fClass') },
  shortcuts:[ {label:'Otočit lavici / tabuli', keys:'R'}, {label:'Duplikovat lavici', keys:'D'}, {label:'Lavice pro 1 ↔ pro 2', keys:'T'}, {label:'Posunout vybranou lavici', keys:'Šipky'}, {label:'Přidat vložené žáky', keys:'Ctrl+Enter'}, {label:'Přiblížit / oddálit plochu', keys:'Ctrl+kolečko'} ],
  settings: ()=> [
    {label: state.opts.eyeFirst ? 'Zrak dopředu: zapnuto' : 'Zrak dopředu: vypnuto', icon:'info', on:state.opts.eyeFirst, run:()=>$('#bEyeFirst').click()},
    {label:'Tisk a export…', icon:'print', run:()=>openCard('cPrint')}
  ],
  danger: ()=> [
    {label:'Vyprázdnit všechny lavice', icon:'x', run:emptyDesks},
    {label:'Smazat všechny žáky', icon:'x', run:()=>$('#bClearSt').click()}
  ],
  onTheme: ()=> { if(state) renderAll(); }
});
</script>
