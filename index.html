<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CabiNet – aplikace pro pedagogy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FECE1A'/%3E%3Cg fill='none' stroke='%23183051' stroke-width='2.2'%3E%3Crect x='7' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1.5'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1.5'/%3E%3Cpath d='M21.5 18v7M18 21.5h7'/%3E%3C/g%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sestaapp-theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="shared/sesta.css?v=1.2.0">
<style>
.hub{overflow:auto;padding:32px 24px 48px}
.hub-in{max-width:1100px;margin:0 auto}
.hero{margin:8px 0 36px}
.word{margin:0;display:flex;align-items:center;gap:12px;font-size:48px;line-height:1;font-weight:800;letter-spacing:.04em;color:var(--navy-strong)}
[data-theme="dark"] .word{color:var(--text)}
.word .app{background:var(--yellow);color:#0B2A53;border-radius:12px;padding:6px 14px 7px;letter-spacing:.06em}
.tag{margin:12px 0 0;font-size:17px;color:var(--text-2)}
/* časová osa vyučovacích hodin */
.tl-wrap{margin-top:26px;overflow-x:auto;padding-bottom:4px}
.tl{position:relative;min-width:720px;height:64px}
.tl-line{position:absolute;left:0;right:0;top:15px;height:2px;border-radius:2px;background:var(--yellow);opacity:.75}
.tl-b{box-sizing:border-box;position:absolute;top:22px;height:38px;border:1px solid var(--border);border-radius:9px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:background .2s,border-color .2s}
.tl-b b{font-size:13px;font-weight:700;color:var(--text)}
.tl-b span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tl-b.now{background:var(--yellow-soft);border-color:var(--yellow)}
.tl-now{position:absolute;top:2px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--navy-strong);transition:left .4s}
[data-theme="dark"] .tl-now{border-top-color:var(--yellow)}
@media (max-width:767px){.word{font-size:34px}.tag{font-size:15px}}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:36px}
.tile{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--bg-app);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-1);color:var(--text);text-decoration:none;transition:box-shadow .15s,transform .15s,border-color .15s}
.tile:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:var(--yellow)}
.tile .top{display:flex;align-items:center;gap:14px}
.tile .ic{width:52px;height:52px;border-radius:14px;background:var(--yellow);color:#183051;display:grid;place-items:center;flex:none}
.tile .ic .s-i{width:28px;height:28px;stroke-width:1.9}
.tile b{font-size:18px}
.tile .d{display:block;font-size:13px;color:var(--muted)}
.tile p{margin:0;color:var(--text-2);font-size:14px;line-height:1.5;flex:1}
.tile .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tile .meta .go{margin-left:auto;font-weight:600;color:var(--text)}
.news{background:var(--bg-app);border:1px solid var(--border);border-radius:16px;padding:8px 20px;box-shadow:var(--sh-1)}
.news-row{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.news-row:last-child{border-bottom:0}
.news-row .n{min-width:110px;font-weight:700}
.news-row .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.news-row ul{margin:0;padding-left:18px;color:var(--text-2)}
.adm-link{margin:28px 0 0;text-align:center;font-size:12.5px}
.adm-link a{color:var(--muted);text-decoration:none}
.adm-link a:hover{color:var(--text);text-decoration:underline}
@media (max-width:767px){.hub{padding:20px 14px 32px}.news-row{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<main class="s-main"><div class="hub"><div class="hub-in">
  <section class="hero">
    <h1 class="word" aria-label="CabiNet"><span>CABI</span><span class="app">NET</span></h1>
    <p class="tag">Aplikace pro pedagogy</p>
    <div class="tl-wrap"><div class="tl" id="tl" aria-label="Rozvrh vyučovacích hodin"></div></div>
  </section>
  <h2 class="sec-t">Aplikace</h2>
  <div class="tiles" id="tiles"></div>
  <h2 class="sec-t">Co je nového</h2>
  <div class="news" id="news"></div>
  <p class="adm-link"><a href="sprava/" data-nav>Správa</a></p>
</div></div></main>
<script src="shared/apps.js?v=1.2.0"></script>
<script src="shared/sesta-firebase.js?v=1.2.0"></script>
<script src="shared/sesta-shell.js?v=1.2.0"></script>
<script>
const S = SESTA;
document.getElementById('tiles').innerHTML = S.apps.map(a => `
  <a class="tile" href="${a.path}" data-nav>
    <div class="top"><span class="ic">${S.icon(a.icon)}</span><span><b>${S.esc(a.name)}</b><span class="d">${S.esc(a.desc)}</span></span></div>
    <p>${S.esc(a.long)}</p>
    <div class="meta">verze ${S.esc(a.version)}<span class="go">Otevřít →</span></div>
  </a>`).join('');
document.querySelectorAll('[data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); S.go(a.getAttribute('href')); }));
document.getElementById('news').innerHTML = S.apps.map(a => { const c = (a.changes||[])[0]; return c ? `<div class="news-row"><div class="n">${S.esc(a.name)} ${S.esc(c.version)}<small>${new Date(c.date).toLocaleDateString('cs-CZ')}</small></div><ul>${c.items.map(i=>`<li>${S.esc(i)}</li>`).join('')}</ul></div>` : ''; }).join('');
/* časová osa – rozvrh je v shared/apps.js (SESTA.bells) */
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const B = S.bells.map(([a, b], i) => ({ n:i + 1, a, b, s:mins(a), e:mins(b) }));
const T0 = B[0].s, T1 = B[B.length - 1].e, pct = m => (m - T0) / (T1 - T0) * 100;
const tl = document.getElementById('tl');
tl.innerHTML = '<div class="tl-line"></div>' + B.map(x => `<div class="tl-b" data-n="${x.n}" style="left:${pct(x.s)}%;width:${pct(x.e) - pct(x.s)}%"><b>${x.n}</b><span>${x.a} – ${x.b}</span></div>`).join('') + '<div class="tl-now" id="tlNow" hidden></div>';
S.onMinute = d => {
  const m = d.getHours() * 60 + d.getMinutes(), wd = d.getDay(), mk = document.getElementById('tlNow');
  const on = wd >= 1 && wd <= 5 && m >= T0 && m <= T1;          // jen ve všední dny v rozsahu osy
  mk.hidden = !on; if (on) mk.style.left = pct(m) + '%';
  tl.querySelectorAll('.tl-b').forEach(b => { const x = B[b.dataset.n - 1]; b.classList.toggle('now', on && m >= x.s && m < x.e); });
};
S.init({ app:'hub', root:'', clock:true });
document.getElementById('sSub').textContent = 'Aplikace pro pedagogy · ' + S.brand.school;
</script>
</body>
</html>
